version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tsap_matrimony
      POSTGRES_USER: tsap
      POSTGRES_PASSWORD: tsap123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./cards:/tmp/cards
      - ./photos:/tmp/photos
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tsap:tsap123@postgres:5432/tsap_matrimony
      - REDIS_URL=redis://redis:6379
      - BOT_TOKEN=${BOT_TOKEN}
      - RAZORPAY_KEY=${RAZORPAY_KEY}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    command: npm run dev -- -H 0.0.0.0 -p 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  bot:
    build: ./backend
    command: python telegram_bot.py
    volumes:
      - ./backend:/app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
    depends_on:
      - backend
      - redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./cards:/var/www/cards
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
